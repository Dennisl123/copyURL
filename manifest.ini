name = "copyURL"
summary = "Copy URL"
description = "Copies the URL of the current page or of a link at the cursor to the clipboard and announces it. Both command gestures can be configured through NVDA's Input Gestures dialog. The Copy Link URL command can be turned off in settings. Each command also has its own independent announcement prefix toggle."
author = "Dennis Long <dennisl@fastmail.com>"
version = "1.9.1"
changelog = "Updated author, compatibility, licensing, and documentation metadata. Improved settings-panel registration and cleanup for add-on reloads."
url = "https://github.com/Dennisl123/copyURL"
docFileName = "readme.html"
minimumNVDAVersion = "2019.3.0"
lastTestedNVDAVersion = "2026.1.1"
